<div class="modal-overlay" (click)="onCancel()">
    <div class="modal-container" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h2>Прикрепить теги к «{{ vault.serviceName }}»</h2>
            <button class="close-btn" (click)="onCancel()">×</button>
        </div>

        <div class="modal-body">
            <div class="form-group">
                <label>Выберите теги</label>
                <div class="tags-selection">
                    @for (tag of availableTags(); track tag.id) {
                    <div class="tag-item" [class.selected]="isSelected(tag.id)" (click)="toggleTag(tag.id)">

                        @if (editingTagId() === tag.id) {
                        <div class="tag-edit-form" (click)="$event.stopPropagation()">
                            <span class="tag-color-preview" [style.background-color]="editColor()"></span>
                            <input type="text" class="tag-input" [ngModel]="editName()"
                                (ngModelChange)="editName.set($event)" placeholder="Название тега"
                                (keydown.enter)="onUpdateTag(tag.id)" />
                            <input type="color" class="tag-color-input" [ngModel]="editColor()"
                                (ngModelChange)="editColor.set($event)" />
                            <button class="btn-icon btn-confirm" (click)="onUpdateTag(tag.id)" title="Сохранить">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M20 6L9 17l-5-5" />
                                </svg>
                            </button>
                            <button class="btn-icon btn-cancel" (click)="cancelEdit()" title="Отмена">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M18 6L6 18M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                        } @else {
                        <span class="tag-color" [style.background-color]="tag.color"></span>
                        <span class="tag-name">{{ tag.name }}</span>

                        <div class="tag-actions" (click)="$event.stopPropagation()">
                            <button class="btn-icon btn-edit" (click)="startEdit(tag)" title="Редактировать">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path
                                        d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
                                    <path d="m15 5 4 4" />
                                </svg>
                            </button>
                            <button class="btn-icon btn-delete" (click)="onDeleteTag(tag.id)" title="Удалить">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                                    <path d="M3 6h18" />
                                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                                </svg>
                            </button>
                        </div>

                        @if (isSelected(tag.id)) {
                        <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 6L9 17l-5-5" />
                        </svg>
                        }
                        }
                    </div>
                    } @empty {
                    <div class="empty-state">Нет доступных тегов. Создайте новый тег ниже.</div>
                    }

                    @if (isCreating()) {
                    <div class="tag-item tag-item--creating">
                        <div class="tag-edit-form">
                            <span class="tag-color-preview" [style.background-color]="newTagColor()"></span>
                            <input type="text" class="tag-input" [ngModel]="newTagName()"
                                (ngModelChange)="newTagName.set($event)" placeholder="Название тега"
                                (keydown.enter)="onCreateTag()" autofocus />
                            <input type="color" class="tag-color-input" [ngModel]="newTagColor()"
                                (ngModelChange)="newTagColor.set($event)" />
                            <button class="btn-icon btn-confirm" (click)="onCreateTag()" title="Создать">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M20 6L9 17l-5-5" />
                                </svg>
                            </button>
                            <button class="btn-icon btn-cancel" (click)="cancelCreate()" title="Отмена">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M18 6L6 18M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    }
                </div>
            </div>

            @if (!isCreating()) {
            <button class="btn-create-tag" (click)="startCreate()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14" />
                    <path d="M12 5v14" />
                </svg>
                Создать тег
            </button>
            }
        </div>

        <div class="modal-footer">
            <button class="modal-button-cancel" (click)="onCancel()">Отмена</button>
            <button class="modal-button-save" (click)="onSave()">Сохранить</button>
        </div>
    </div>
</div>
