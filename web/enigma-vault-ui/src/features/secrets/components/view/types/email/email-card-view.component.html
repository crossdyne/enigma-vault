<div class="display-field">
    <label>Логин</label>
    <div class="display-value">
        <span class="display-text">{{ data().Login }}</span>
        <copy-button [value]="data().Login" />
    </div>
</div>
<div class="display-field">
    <label>Электронная Почта</label>
    <div class="display-value">
        <span class="display-text">{{ data().Email }}</span>
        <copy-button [value]="data().Email" />
    </div>
</div>
<div class="display-field">
    <label>Пароль</label>
    <div class="display-value">
        <span class="display-text">{{ data().Password }}</span>
        <copy-button [value]="data().Password" />
    </div>
</div>
<div class="display-field">
    <label>SMTP Хост</label>
    <div class="display-value">
        <span class="display-text">{{ data().SmtpServer }}</span>
        <copy-button [value]="data().SmtpServer" />
    </div>
</div>
<div class="display-field">
    <label>SMTP Порт</label>
    <div class="display-value">
        <span class="display-text">{{ data().SmtpPort }}</span>
        <copy-button [value]="data().SmtpPort" />
    </div>
</div>
<div class="display-field">
    <label>Тип шифрования</label>
    <div class="display-value">
        <span class="display-text">{{ data().EncryptionType }}</span>
        <copy-button [value]="data().EncryptionType" />
    </div>
</div>
