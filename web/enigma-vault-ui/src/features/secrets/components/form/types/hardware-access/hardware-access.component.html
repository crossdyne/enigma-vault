<div class="form-body">
    <input 
    [value]="data().Login"
    (input)="data.update(v => ({ ...v, Login: $any($event.target).value }))" 
    placeholder="Логин" />

    <input 
    [value]="data().Password"
    (input)="data.update(v => ({...v, Password: $any($event.target).value}))" 
    placeholder="Пароль" />
    
    <input 
    [value]="data().Manufacturer"
    (input)="data.update(v => ({...v, Manufacturer: $any($event.target).value}))" 
    placeholder="Производитель" />

</div>
