<div class="form-body">
    <input 
    [value]="data().Login"
    (input)="data.update(v => ({ ...v, Login: $any($event.target).value }))" 
    placeholder="Логин" />

    <input 
    [value]="data().Email"
    (input)="data.update(v => ({...v, Email: $any($event.target).value}))" 
    placeholder="Почта" />
    
    <input 
    [value]="data().Password"
    (input)="data.update(v => ({...v, Password: $any($event.target).value}))" 
    placeholder="Пароль" />
    
    <input 
    [value]="data().SmtpServer"
    (input)="data.update(v => ({...v, SmtpServer: $any($event.target).value}))" 
    placeholder="SMTP Хост" />

    <input 
    [value]="data().SmtpPort"
    (input)="data.update(v => ({...v, SmtpPort: $any($event.target).value}))" 
    placeholder="SMTP Порт" />

    <input 
    [value]="data().EncryptionType"
    (input)="data.update(v => ({...v, EncryptionType: $any($event.target).value}))" 
    placeholder="Тип шифрования" />

</div>
