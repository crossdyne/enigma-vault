<div class="form-body">

    <input 
    [value]="data().Product"
    (input)="data.update(v => ({...v, Product: $any($event.target).value}))" 
    placeholder="Продукт активации" />

    <input 
    [value]="data().Key"
    (input)="data.update(v => ({ ...v, Key: $any($event.target).value }))" 
    placeholder="Ключ" />

</div>
