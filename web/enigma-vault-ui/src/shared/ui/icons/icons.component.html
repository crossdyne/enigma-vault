<div class="modal-overlay" (click)="onCancel()">
    <div class="modal-container" (click)="$event.stopPropagation()">

        <div class="modal-header">
            <h2>Выбор иконки для записи «{{ serviceName() }}»</h2>

            <div class="header-actions">
                <button class="reload-btn" (click)="onReload()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-rotate-ccw preview-icon">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                        <path d="M3 3v5h5" />
                    </svg>
                </button>

                <button class="close-btn" (click)="onCancel()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x preview-icon"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
        </div>

        <div class="modal-body">
            <div class="assets-container">
                @for (group of groupedIcons(); track group.title) {
                <div class="icon-group">
                    <h3 class="group-title">{{ group.title }}</h3>

                    <div class="group-items">
                        @for (icon of group.icons; track icon.assetId) {
                        <div class="svg-card-container" [appTooltip]="icon.assetName" (click)="selectedIcon.set(icon)">
                            <img [src]="icon.url" [alt]="icon.assetName">
                        </div>
                        }
                    </div>
                </div>
                } @empty {
                <div class="empty-state">Нет доступных иконок</div>
                }
            </div>
        </div>

        <div class="modal-footer">
            <button class="modal-button add-icon" (click)="navigateToCreateAssets()">Добавить</button>
            <button class="modal-button" (click)="onCancel()">Отмена</button>
        </div>

    </div>
</div>
