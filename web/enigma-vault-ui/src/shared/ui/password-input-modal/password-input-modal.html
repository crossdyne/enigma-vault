<div class="modal-overlay">
    <div class="modal-container" role="dialog" aria-modal="true">
        
        <div class="modal-header">
            <h2>Ввод пароля</h2>
            <button class="close-btn" (click)="onCancel()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x preview-icon"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>

        <div class="modal-body">
            <span>Это необходимо для расшифровки ваших данных</span>
                <input [value]="password()" (input)="password.set($any($event.target).value)" type="password">
                @if (errors()) {
                    <span class="errors">{{ errors() }}</span>
                }
        </div>

        <div class="modal-footer">
            <button class="modal-button-cancel" (click)="onCancel()">
                Отмена
            </button>
            <button class="modal-button-save" (click)="submit()">
                Продолжить
            </button>
        </div>
    </div>
</div>
